name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate tag, manifest version and release notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_metadata.py "$RELEASE_TAG"
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yaml
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/release_metadata.py "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag
                --title "ESB Meter Data $RELEASE_VERSION"
                --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "${args[@]}"
